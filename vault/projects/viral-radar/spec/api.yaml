openapi: 3.0.3
info:
  title: viral-radar
  version: 0.1.0
  description: Generated by Lookout from documented read surfaces. Promote into the
    target repo as api.yaml when ready.
paths:
  /:
    get:
      summary: App home (Now tab HTML)
      responses:
        '200':
          description: 200 JSON — App home (Now tab HTML)
  /api/health:
    get:
      summary: 'Health check — `{"status": "ok", "db": "ok"}'
      responses:
        '200':
          description: '200 JSON — Health check — `{"status": "ok", "db": "ok"}'
  /api/posts/{post_id}:
    get:
      summary: Post detail including AI analysis fields
      responses:
        '200':
          description: 200 JSON — Post detail including AI analysis fields
  /accounts:
    get:
      summary: List watchlist accounts, excluding the self account
      responses:
        '200':
          description: 200 JSON — List watchlist accounts, excluding the self account
  /accounts/scorecard-review:
    get:
      summary: List accounts pending scorecard review
      responses:
        '200':
          description: 200 JSON — List accounts pending scorecard review
  /accounts/{account_id}/posts:
    get:
      summary: List posts for an account
      responses:
        '200':
          description: 200 JSON — List posts for an account
  /accounts/{account_id}/scrapes:
    get:
      summary: List scrape runs for an account
      responses:
        '200':
          description: 200 JSON — List scrape runs for an account
  /self-account:
    get:
      summary: Return the current self account, or null
      responses:
        '200':
          description: 200 JSON — Return the current self account, or null
  /self-account/posts:
    get:
      summary: Return posts for the self account (powers the Self tab)
      responses:
        '200':
          description: 200 JSON — Return posts for the self account (powers the Self
            tab)
  /self-account/analysis:
    get:
      summary: Return analysis for the self account
      responses:
        '200':
          description: 200 JSON — Return analysis for the self account
  /self-account/scrapes:
    get:
      summary: List scrape runs for the self account
      responses:
        '200':
          description: 200 JSON — List scrape runs for the self account
  /niches/default:
    get:
      summary: Return the default niche
      responses:
        '200':
          description: 200 JSON — Return the default niche
  /niches/{niche_id}/recipe:
    get:
      summary: 'Niche recipe: equal-weighted signal aggregation with AI blend and
        example posts'
      responses:
        '200':
          description: '200 JSON — Niche recipe: equal-weighted signal aggregation
            with AI blend and example posts'
  /niches/{niche_id}/gap-report:
    get:
      summary: 'Gap report: gold-post signals present in the niche recipe but missing
        from an account (`?account=<name>`)'
      responses:
        '200':
          description: '200 JSON — Gap report: gold-post signals present in the niche
            recipe but missing from an account (`?account=<name>`)'
  /niches/{niche_id}/anti-patterns:
    get:
      summary: List anti-pattern findings scoped to a niche
      responses:
        '200':
          description: 200 JSON — List anti-pattern findings scoped to a niche
  /api/gap-report/default:
    get:
      summary: Gap report for the default niche and self account
      responses:
        '200':
          description: 200 JSON — Gap report for the default niche and self account
  /candidates/discover/status:
    get:
      summary: Poll the status of the current discovery run
      responses:
        '200':
          description: 200 JSON — Poll the status of the current discovery run
  /candidates/settings/queries:
    get:
      summary: Get stored web-search queries
      responses:
        '200':
          description: 200 JSON — Get stored web-search queries
  /candidates/{candidate_id}/sample:
    get:
      summary: Return the cached quarantine scorecard without re-scraping
      responses:
        '200':
          description: 200 JSON — Return the cached quarantine scorecard without re-scraping
  /api/suggestions:
    get:
      summary: List all post suggestions
      responses:
        '200':
          description: 200 JSON — List all post suggestions
  /api/suggestions/{suggestion_id}/export:
    get:
      summary: Export a kept suggestion as a prose-free skeleton Markdown draft
      responses:
        '200':
          description: 200 JSON — Export a kept suggestion as a prose-free skeleton
            Markdown draft
  /api/waves:
    get:
      summary: List engagement waves available as sources for AI post suggestions
      responses:
        '200':
          description: 200 JSON — List engagement waves available as sources for AI
            post suggestions
  /api/waves/{wave}/suggestions:
    get:
      summary: List previously generated suggestions for a wave
      responses:
        '200':
          description: 200 JSON — List previously generated suggestions for a wave
  /api/waves/{wave}/suggestions/export-kept:
    get:
      summary: Export all kept suggestions for a wave
      responses:
        '200':
          description: 200 JSON — Export all kept suggestions for a wave
  /api/waves/live:
    get:
      summary: List currently live waves with lift scores
      responses:
        '200':
          description: 200 JSON — List currently live waves with lift scores
  /api/waves/terms:
    get:
      summary: Get wave search terms configuration
      responses:
        '200':
          description: 200 JSON — Get wave search terms configuration
  /api/settings/voice-notes:
    get:
      summary: Get the voice-notes guidance used to steer suggestion generation
      responses:
        '200':
          description: 200 JSON — Get the voice-notes guidance used to steer suggestion
            generation
  /api/settings/gold-multiplier:
    get:
      summary: Get the configured gold-tier engagement multiplier
      responses:
        '200':
          description: 200 JSON — Get the configured gold-tier engagement multiplier
  /api/fingerprint:
    get:
      summary: Return the self account's voice fingerprint
      responses:
        '200':
          description: 200 JSON — Return the self account's voice fingerprint
  /api/fingerprint/compare:
    get:
      summary: Compare the self account's voice fingerprint with niche patterns
      responses:
        '200':
          description: 200 JSON — Compare the self account's voice fingerprint with
            niche patterns
  /api/fingerprint/niche:
    get:
      summary: Return the niche-level voice fingerprint
      responses:
        '200':
          description: 200 JSON — Return the niche-level voice fingerprint
  /api/voice-fingerprint:
    get:
      summary: Return the raw voice fingerprint record
      responses:
        '200':
          description: 200 JSON — Return the raw voice fingerprint record
  /api/questions:
    get:
      summary: List audience questions
      responses:
        '200':
          description: 200 JSON — List audience questions
  /api/questions/{question_id}/export:
    get:
      summary: Export a question as a prose-free skeleton
      responses:
        '200':
          description: 200 JSON — Export a question as a prose-free skeleton
  /api/posts/{post_id}/comments:
    get:
      summary: List scraped comments for a post
      responses:
        '200':
          description: 200 JSON — List scraped comments for a post
  /api/comments/gold-targets:
    get:
      summary: List gold posts that have unanswered audience questions
      responses:
        '200':
          description: 200 JSON — List gold posts that have unanswered audience questions
  /api/calendar/events:
    get:
      summary: List calendar events
      responses:
        '200':
          description: 200 JSON — List calendar events
  /api/calendar/events/{event_id}:
    get:
      summary: Get a calendar event
      responses:
        '200':
          description: 200 JSON — Get a calendar event
  /api/calendar/windows:
    get:
      summary: List upcoming posting windows derived from calendar events
      responses:
        '200':
          description: 200 JSON — List upcoming posting windows derived from calendar
            events
  /api/now:
    get:
      summary: Weekly Now-tab recommendation payload
      responses:
        '200':
          description: 200 JSON — Weekly Now-tab recommendation payload
  /api/drafts:
    get:
      summary: List drafts
      responses:
        '200':
          description: 200 JSON — List drafts
  /api/predictions/calibration:
    get:
      summary: Return tier-prediction calibration stats
      responses:
        '200':
          description: 200 JSON — Return tier-prediction calibration stats
  /api/beta-drafts/latest:
    get:
      summary: Return the most recent AI-authored beta draft
      responses:
        '200':
          description: 200 JSON — Return the most recent AI-authored beta draft
  /api/templates:
    get:
      summary: List active template variants
      responses:
        '200':
          description: 200 JSON — List active template variants
  /api/templates/verdict-rules:
    get:
      summary: List verdict rules used in template scoring
      responses:
        '200':
          description: 200 JSON — List verdict rules used in template scoring
  /api/analysis:
    get:
      summary: Analysis feed — flagged suggestions and pattern findings
      responses:
        '200':
          description: 200 JSON — Analysis feed — flagged suggestions and pattern
            findings
  /api/analysis/flags:
    get:
      summary: List analysis flag entries
      responses:
        '200':
          description: 200 JSON — List analysis flag entries
  /api/gold-analysis/status:
    get:
      summary: Poll the status of the current gold-analysis job
      responses:
        '200':
          description: 200 JSON — Poll the status of the current gold-analysis job
  /api/content-plan/pending-attribution:
    get:
      summary: List content-plan slots pending post attribution
      responses:
        '200':
          description: 200 JSON — List content-plan slots pending post attribution
  /api/content-plan/{plan_id}/beats:
    get:
      summary: Return the beat inventory for a content-plan slot
      responses:
        '200':
          description: 200 JSON — Return the beat inventory for a content-plan slot
  /api/criteria-audit:
    get:
      summary: List criteria self-audit findings
      responses:
        '200':
          description: 200 JSON — List criteria self-audit findings
  /api/crux/verdicts/{plan_id}:
    get:
      summary: Return the settled crux verdict for a content-plan slot
      responses:
        '200':
          description: 200 JSON — Return the settled crux verdict for a content-plan
            slot
  /api/crux/summary:
    get:
      summary: Gold-caliber posts per month vs hours spent
      responses:
        '200':
          description: 200 JSON — Gold-caliber posts per month vs hours spent
